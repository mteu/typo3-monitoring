<html
    data-namespace-typo3-fluid="true"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"

>

<f:layout name="Module" />


<f:section name="Content">
    <f:if condition="{reporters}">
        <f:then>
            <f:render partial="Backend/Reporter/List" arguments="{reporters: reporters, dispatcher: dispatcher}" />
        </f:then>
        <f:else>
            <div class="alert alert-info">
                <div class="alert-inner">
                    <div class="alert-icon">
                        <span class="icon-emphasized">
                            <core:icon identifier="actions-info" />
                        </span>
                    </div>
                    <div class="alert-content">
                        <div class="alert-title">
                            <f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:reporters.no_reporters_found" />
                        </div>
                        <p class="alert-message">
                            <f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:reporters.no_reporters_found.content"
                                         arguments="{0: reporterInterface}" />
                        </p>
                    </div>
                </div>
            </div>
        </f:else>
    </f:if>
</f:section>

</html>
