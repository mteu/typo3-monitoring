<html
    data-namespace-typo3-fluid="true"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"

>

<f:layout name="Module" />

<f:section name="Content">
    <f:flashMessages queueIdentifier="{monitoringMessageQueueIdentifier}" />

    <h1>
        <f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:module.title" />
    </h1>
    <p>
        <f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:module.description" />
    </p>


    <f:if condition="{serviceCards.providers.count} > 0">
        <f:then>
            <f:if condition="{providerUnhealthyCount} == 0">
                <f:then>
                    <f:comment><!-- All OK --></f:comment>
                    <f:be.infobox
                        title="{f:translate(key: 'LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:monitoring.overview.overallStatus.healthy.title')}"
                        iconName="actions-check"
                        state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::OK')}"
                    >
                        <f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:monitoring.overview.overallStatus.healthy.subtitle" />
                    </f:be.infobox>
                </f:then>
                <f:else>
                    <f:comment><!-- Not OK --></f:comment>
                    <f:be.infobox
                        title="{f:translate(key: 'LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:monitoring.overview.overallStatus.unhealthy.title')}"
                        iconName="actions-exclamation"
                        state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::ERROR')}"
                    >
                        <f:if condition="{providerUnhealthyCount} > 1">
                            <f:then>
                                <f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:monitoring.overview.overallStatus.unhealthy.subtitle.plural" arguments="{0: providerUnhealthyCount}"/>
                            </f:then>
                            <f:else>
                                <f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:monitoring.overview.overallStatus.unhealthy.subtitle.singular"/>
                            </f:else>
                        </f:if>

                        <a href="{serviceCards.providers.url}" style="text-decoration: underline"><f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:monitoring.overview.overallStatus.unhealthy.link"/></a>
                    </f:be.infobox>
                </f:else>
            </f:if>
        </f:then>
        <f:else>
            <f:comment><!--  No active providers <f:if condition="{serviceCards.providers.count} === 0"> --></f:comment>
            <f:be.infobox
                title="{f:translate(key: 'LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:providers.card.linkLabel.zero')}"
                iconName="actions-info"
                state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
            >
                <f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:monitoring.overview.overallStatus.warning.subtitle" />
            </f:be.infobox>
        </f:else>

    </f:if>



    <f:render section="Cards" arguments="{cards: serviceCards}" />

</f:section>

<f:section name="Cards">
    <h2><f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:services.title" /></h2>
    <div class="card-container">
        <f:for each="{cards}" as="service" key="serviceKey">
            <div class="card card-size-small">
                <div class="card-header">
                    <div class="card-icon">
                        <core:icon identifier="{service.iconIdentifier}" size="small" />
                    </div>
                    <div class="card-header-body">
                        <h2 class="card-title">{service.title}</h2>
                    </div>
                </div>
                <div class="card-body">
                    <p class="card-text">
                        {service.body}
                    </p>
                </div>
                <div class="card-footer">
                    <a href="{service.url}" class="btn {f:if(condition: '{serviceKey} == documentation', then: 'btn-secondary', else: 'btn-primary')}" {f:if(condition: '{service.isExternalLink}', then: 'target="_blank"')}>
                        {service.linkTitle}
                        <f:if condition="{service.isExternalLink}">
                            <core:icon identifier="{service.linkIconIdentifier}" />
                        </f:if>
                    </a>
                </div>
            </div>
        </f:for>
    </div>
</f:section>

</html>
