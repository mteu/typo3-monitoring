<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:monitoring="http://typo3.org/ns/mteu/Monitoring/ViewHelper/Backend"
>

    <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th><f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:detail.header.component" /></th>
                    <th><f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:detail.header.status" /></th>
                    <th><f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:detail.header.reason" /></th>
                </tr>
            </thead>
            <tbody>
            <f:for each="{details}" as="detail">
                <tr>
                    <td>{detail.name}</td>
                    <td>
                        <span class="badge badge-{detail.statusValue -> monitoring:statusContext()}">
                            <f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:status.{detail.statusValue}" />
                        </span>
                    </td>
                    <td>
                        <f:sanitize.html>{detail.reason}</f:sanitize.html>
                    </td>
                </tr>
            </f:for>
            </tbody>
        </table>

</html>
