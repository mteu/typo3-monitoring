<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
>

<ul class="nav nav-pills">
    <f:for each="{navigation}" as="navItem">
        <li class="nav-item">
            <a class="nav-link {f:if(condition: '{navItem.isActive}', then: 'active')}" aria-current="page" href="{navItem.href}">{navItem.title}</a>
        </li>
    </f:for>
</ul>
