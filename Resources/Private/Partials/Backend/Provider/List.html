<html
    data-namespace-typo3-fluid="true"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
>

<f:layout name="Module" />

<h2>
    <f:if condition="{listTitle}">
        <f:then>
            {listTitle}
        </f:then>
        <f:else>
            <f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:providers.list.title" />
        </f:else>
    </f:if>
</h2>

<p>
    <f:translate key="LLL:EXT:monitoring/Resources/Private/Language/locallang.be.xlf:providers.list.description" />
</p>

<f:for each="{providers}" as="provider" key="providerClass" iteration="iterator">
    <f:render partial="Backend/Provider/Item" arguments="{_all}" />
</f:for>

</html>
