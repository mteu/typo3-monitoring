name: CGL
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  zizmor:
    name: Audit GitHub workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.33.1
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true

  cgl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          tools: composer:v2, composer-unused
          coverage: none

      # Validation
      - name: Validate composer.json
        run: composer validate --no-check-lock

      # Audit lock files against known advisories
      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Audit npm dependencies
        working-directory: Tests/Acceptance
        run: npm audit --package-lock-only --audit-level=high

      # Install dependencies
      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # Analyze
      - name: Analyze dependencies
        run: composer cgl analyze:dependencies

      # Linting
      - name: Lint composer.json
        run: composer cgl lint:composer

      - name: Lint .editorconfig
        run: composer cgl lint:editorconfig

      - name: Lint PHP
        run: composer cgl lint:php

      - name: Lint YAML
        run: composer cgl lint:yaml

      - name: Lint XLIFF
        uses: ./.github/actions/xliff-validation

      # SCA
      - name: SCA PHP
        run: composer cgl sca:php -- --error-format github

      - name: Migration
        run: composer cgl sca:migrate:php --dry-run
