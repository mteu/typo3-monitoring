name: Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TYPO3_DISABLE_DOCS_VERSION_UPDATE: 1
  TYPO3_EXTENSION_KEY: monitoring
  TYPO3_EXCLUDE_FROM_PACKAGING: packaging_exclude.php
  TAILOR_VERSION: 2.1.0

jobs:
  # build extension for TER publishing
  build:
    name: Build extension artefact
    runs-on: ubuntu-latest
    outputs:
      artefact: ${{ steps.check-tag.outputs.artefact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Tag names may contain shell metacharacters, so they only ever reach the shell through env.
      - name: Check tag
        id: check-tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error::Tag is not a semantic version (MAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "artefact=monitoring_${TAG}.zip" >> "$GITHUB_OUTPUT"

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4
          tools: composer:v2, typo3/tailor:${{ env.TAILOR_VERSION }}
          coverage: none

      - name: Reset files
        run: git reset --hard HEAD && git clean -dfx

      - name: Create artefact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          php ~/.composer/vendor/bin/tailor set-version "$TAG"
          php ~/.composer/vendor/bin/tailor create-artefact "$TAG"

      - name: Upload extension artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-artefact
          path: tailor-version-artefact/${{ steps.check-tag.outputs.artefact }}

  # Job: Create release
  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-notes-url: ${{ steps.create-release.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download extension artefact
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-artefact

      # Create release
      - name: Create release
        id: create-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: ${{ steps.download.outputs.download-path }}/${{ needs.build.outputs.artefact }}

  # Publish to TER
  ter-publish:
    name: Publish on TER
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download extension artefact
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-artefact

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2, typo3/tailor:${{ env.TAILOR_VERSION }}

      # Release. The API token is scoped to this step only.
      - name: Publish to TER
        env:
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
          TAG: ${{ github.ref_name }}
          RELEASE_NOTES_URL: ${{ needs.release.outputs.release-notes-url }}
          ARTEFACT_PATH: ${{ steps.download.outputs.download-path }}/${{ needs.build.outputs.artefact }}
        run: |
          php ~/.composer/vendor/bin/tailor ter:publish \
            --comment "See release notes at ${RELEASE_NOTES_URL}" \
            --artefact "$ARTEFACT_PATH" \
            "$TAG"
